name: CI/CD

# Phase 10 of plan.md: lint/build gate on every push+PR, then (main only)
# build+push a Docker image, smoke-test it against the full docker-compose
# stack, and promote :candidate -> :stable only if the smoke test passes.
# See docs/deployment.md for what "deploy" means in this local-only setup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # next build traces/imports lib/auth.ts and lib/db.ts at compile time even
  # though nothing is queried at build time (see Dockerfile) — same
  # placeholders here so `bun run build` outside Docker doesn't fail on
  # missing env vars.
  DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?sslmode=disable"
  BETTER_AUTH_SECRET: "build-time-placeholder"
  BETTER_AUTH_URL: "http://localhost:3000"
  GITHUB_CLIENT_ID: "build-time-placeholder"
  GITHUB_CLIENT_SECRET: "build-time-placeholder"
  GOOGLE_GENERATIVE_AI_API_KEY: "build-time-placeholder"
  NEXT_PUBLIC_APP_BASE_URL: "http://localhost:3000"

jobs:
  lint-and-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: bun run build

  docker-build:
    name: Build & push image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      sha_tag: ${{ steps.image.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name/tags
        id: image
        run: |
          IMAGE_NAME=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$SHA_SHORT" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.name }}:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke test :candidate against full stack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull candidate image
        run: docker pull ${{ needs.docker-build.outputs.image }}:candidate

      - name: Write .env.docker (dummy secrets — smoke test never exercises real OAuth)
        run: |
          cat > .env.docker <<EOF
          GITHUB_CLIENT_ID=smoke-test-placeholder
          GITHUB_CLIENT_SECRET=smoke-test-placeholder
          BETTER_AUTH_SECRET=$(openssl rand -base64 32)
          BETTER_AUTH_URL=http://localhost:3000
          NEXT_PUBLIC_APP_BASE_URL=http://localhost:3000
          GOOGLE_GENERATIVE_AI_API_KEY=smoke-test-placeholder
          EOF

      - name: Start full stack (candidate image, no rebuild)
        env:
          APP_IMAGE: "${{ needs.docker-build.outputs.image }}:candidate"
        run: docker compose up -d

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then
              echo "healthy"
              exit 0
            fi
            echo "attempt $i: not healthy yet"
            sleep 5
          done
          echo "app never became healthy"
          docker compose logs app
          exit 1

      - name: Run k6 smoke test
        env:
          APP_IMAGE: "${{ needs.docker-build.outputs.image }}:candidate"
        run: docker compose --profile load-test run --rm k6 run /scripts/smoke.js

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        env:
          APP_IMAGE: "${{ needs.docker-build.outputs.image }}:candidate"
        run: docker compose down -v

  promote-or-rollback:
    name: Promote :candidate -> :stable (or rollback)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always()
    needs: [docker-build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate to stable
        if: needs.smoke-test.result == 'success'
        run: |
          IMAGE="${{ needs.docker-build.outputs.image }}"

          # Keep exactly one rollback target: whatever :stable pointed to
          # before this promotion becomes :stable-previous. Ignore failure
          # the very first time this pipeline ever runs, when :stable
          # doesn't exist yet.
          docker buildx imagetools create --tag "$IMAGE:stable-previous" "$IMAGE:stable" || \
            echo "no existing :stable to preserve as :stable-previous (first run?)"

          docker buildx imagetools create --tag "$IMAGE:stable" "$IMAGE:candidate"

          echo "### Promoted to :stable :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:candidate\` (${{ needs.docker-build.outputs.sha_tag }}) is now \`$IMAGE:stable\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Report rollback (never promoted)
        if: needs.smoke-test.result != 'success'
        run: |
          IMAGE="${{ needs.docker-build.outputs.image }}"
          {
            echo "### Deploy blocked — :stable unchanged :x:"
            echo "The smoke test against \`$IMAGE:candidate\` (${{ needs.docker-build.outputs.sha_tag }}) failed."
            echo "\`:stable\` still points at the last known-good image — nothing was promoted."
            echo ""
            echo "Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
