apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Click a span in a trace -> jump to its exact log lines in Loki,
      # filtered by the traceId label promtail-config.yml attaches to every
      # log line (see the comment there on why that's a local-demo-only
      # choice, not a production Loki labeling strategy).
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        tags:
          - key: traceId
            value: traceId
      serviceMap:
        datasourceUid: prometheus
