server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Auto-discovers every container on this Docker daemon and tails its
  # json-file logs — the outer {"log", "stream", "time"} envelope Docker
  # itself wraps stdout in is unwrapped by Promtail's docker_sd target
  # before pipeline_stages ever sees it, so `json:` below parses our pino
  # lines directly.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            traceId: traceId
            requestId: requestId
            route: route
            time: time
      # traceId as a Loki label is what makes Tempo's "trace to logs" button
      # work (see grafana/provisioning/datasources/datasources.yml) — fine
      # at this app's local-demo log volume, but a real deployment should
      # NOT put a high-cardinality field like this in labels (every unique
      # trace becomes its own stream); it belongs in structured metadata
      # instead on a production-scale Loki.
      - labels:
          level:
          traceId:
      - timestamp:
          source: time
          format: UnixMs
